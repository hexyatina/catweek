name: Backend CI

on:
  push:
    branches:
      - main
      - prod
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - prod
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Format
        working-directory: backend
        id: format
        continue-on-error: true
        run: uv run ruff format

      - name: Lint
        working-directory: backend
        id: lint
        continue-on-error: true
        run: uv run ruff check

      - name: Type check
        working-directory: backend
        id: type
        continue-on-error: true
        run: uv run mypy src/ --check-untyped-defs

      - name: Summary
        if: always()
        run: |
          echo "## Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Format: ${{ steps.format.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ steps.type.outcome }}" >> $GITHUB_STEP_SUMMARY

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Start PostgreSQL
        run: docker compose -f docker/docker-compose.ci.yaml up -d --wait db

      - name: Run Pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL_LOCAL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker/docker-compose.ci.yaml down

  build-and-push:
    needs: [ lint, tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.version.outputs.sha_tag }}
      git_tag: ${{ steps.version.outputs.git_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version info
        id: version
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          SHA_TAG="sha-${GIT_SHA}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "SHA tag: $SHA_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sha_tagged image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha_tag }}
          build-args: |
            GIT_SHA=${{ steps.version.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run smoke test
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha_tag }}
        run: |
          docker compose -f docker/docker-compose.ci.yaml up -d --wait

          echo "Service is up! Fetching details..."
          curl -sf http://localhost:5000/health | jq .
          curl -sf http://localhost:5000/ready | jq .
          
          docker compose -f docker/docker-compose.ci.yaml down
          echo "All smoke tests passed!"

  tag:
    needs: smoke-test
    runs-on: ubuntu-latest
    if: github.ref_name == 'prod' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "backend-v"
          default_bump: patch
          release_branches: prod

      - name: Tag summary
        run: |
          echo "## Tag Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ steps.tag.outputs.new_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${{ steps.tag.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Changelog: ${{ steps.tag.outputs.changelog }}" >> $GITHUB_STEP_SUMMARY