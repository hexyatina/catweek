name: Backend CI

on:
  push:
    branches:
      - main
      - prod
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - prod
    paths:
      - 'backend/**'
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Format
        working-directory: backend
        id: format
        continue-on-error: true
        run: uv run ruff format

      - name: Lint
        working-directory: backend
        id: lint
        continue-on-error: true
        run: uv run ruff check

      - name: Type check
        working-directory: backend
        id: type
        continue-on-error: true
        run: uv run mypy src/ --check-untyped-defs

      - name: Summary
        if: always()
        run: |
          echo "## Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Format: ${{ steps.format.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ steps.type.outcome }}" >> $GITHUB_STEP_SUMMARY

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Start PostgreSQL
        run: docker compose -f docker/docker-compose.ci.yaml up -d --wait db

      - name: Run Pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL_LOCAL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker/docker-compose.ci.yaml down

  build:
    needs: [ lint, tests ]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      git-sha: ${{ steps.version.outputs.git_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          BRANCH=${{ github.ref_name }}
          
          if [ "$BRANCH" = "prod" ]; then
            if git describe --tags --exact-match 2>/dev/null; then
              VERSION=$(git describe --tags --exact-match | sed 's/^backend-v//')
            else
              # Fallback if no tag
              VERSION="prod-${GIT_SHA}"
            fi
          else
            # On main branch: dev version with sha
            VERSION="0.0.0-${GIT_SHA}"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH | Version: $VERSION | SHA: $GIT_SHA"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: backend:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image
        run: docker save backend:${{ steps.version.outputs.version }} | gzip > /tmp/backend-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar.gz
          retention-days: 1

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load image
        run: |
          gunzip -c /tmp/backend-image.tar.gz | docker load
          docker tag backend:${{ needs.build.outputs.version }} backend:latest

      - name: Run smoke test
        env:
          IMAGE_NAME: backend:latest
        run: |
          docker compose -f docker/docker-compose.ci.yaml up -d --wait

          echo "Service is up! Fetching details..."
          curl -sf http://localhost:5000/health | jq .
          curl -sf http://localhost:5000/ready | jq .
          
          docker compose -f docker/docker-compose.ci.yaml down
          echo "All smoke tests passed!"