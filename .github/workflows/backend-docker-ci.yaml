name: Backend Docker CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker-ci.yaml'
      - 'docker/docker-compose.ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name == 'push'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke test
        run: bash ./ci-build.sh

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          VERSION=$(cd backend && git describe --tags --exact-match 2>/dev/null | sed 's/^backend-v//' || echo "0.0.0-$(git rev-parse --short HEAD)")
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
