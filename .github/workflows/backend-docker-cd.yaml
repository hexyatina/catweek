name: Backend CD

on:
  push:
    tags:
      - 'backend-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e. g. backend-v1.2.3). Defaults to latest backend-v* tag."
        required: false


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG=${{ steps.resolve.outputs.tag }}
          VERSION=$(echo $TAG | sed 's/^backend-v//')
          GIT_SHA=$(git rev-parse --short HEAD)
          SHA_TAG="sha-${GIT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "Tag: $TAG | Version: $VERSION | SHA: $GIT_SHA | Image tag: $SHA_TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag and push
        run: |
          SHA_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha_tag }}"
          VERSION_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          
          echo "Pulling $SHA_IMAGE ..."
          docker pull "$SHA_IMAGE"
          
          docker tag "$SHA_IMAGE" "$VERSION_IMAGE"
          docker tag "$SHA_IMAGE" "$LATEST_IMAGE"
          
          echo "Pushing $VERSION_IMAGE ..."
          docker push "$VERSION_IMAGE"
          
          echo "Pushing $LATEST_IMAGE ..."
          docker push "$LATEST_IMAGE"

      - name: Update VERSION on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSL -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/APP_VERSION" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"value\": \"${VERSION}\"}"
          echo "APP_VERSION set to ${VERSION}"


      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set, skipping."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: "Backend ${{ steps.version.outputs.version }}"
          body: |
            ## Backend ${{ steps.version.outputs.version }}
            
            **Commit:** `${{ steps.version.outputs.git_sha }}`
            
            **Docker image:**
            ```
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```
            
            **Pull:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false

      - name: Deploy summary
        run: |
          echo "## Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** \`${{ steps.version.outputs.git_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY