services:
  backend:
    image: ${IMAGE_NAME:-ghcr.io/hexyatina/catweek-backend:latest}
    environment:
      APP_ENV: prod
      DB_ENV: local
      DATABASE_LOCAL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      PORT: "5000"
      WORKERS: "1"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5