services:
  backend:
    image: ${IMAGE_NAME:-ghcr.io/hexyatina/catweek-backend:latest}
    restart: "no"
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      DB_ENV: local
      DATABASE_URL_LOCAL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      API_KEY: "test-ci-key"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5